{% extends 'base.html' %}

{% block title %}Login | BEYOND BADULLA{% endblock %}

{% block content %}

<section class="auth">
    <div class="authbox">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Continue your <em>journey.</em></h1>
        <p>Log in to save places and build your day plan.</p>

        <form method="post">
            <label>
                Username
                <input name="username" required>
            </label>

            <label>
                Password
                <input type="password" name="password" required>
            </label>

            <button class="btn primary full">Log in</button>
        </form>

        <small>
            New here?
            <a href="{{url_for('register')}}">Create an account</a>
        </small>
    </div>
</section>

{% endblock %}
